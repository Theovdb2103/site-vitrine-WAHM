<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <!-- Anti-FOUC : pose data-theme AVANT le premier paint (choix mémorisé sinon préférence système). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wahm_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <!-- Titre et meta par page : injectes par le composant Seo (vite-react-ssg Head). -->
  <link rel="icon" type="image/png" href="/assets/wahm-mark.png" />
  <!-- Toutes les polices du site sont auto-hébergées (voir src/index.css) : aucune
       requête vers un domaine tiers.
       General Sans a été retiré : ses fichiers sont servis par cdn.fontshare.com, que la
       CSP de vercel.json n'autorise pas — la police était donc déjà bloquée en
       production et les visiteurs voyaient Montserrat. Charger sa feuille de style
       revenait à payer une connexion tierce pour un résultat invisible. Rétablir
       General Sans suppose d'ajouter cdn.fontshare.com à font-src, ce qui changerait
       l'apparence réelle du site : à décider séparément. -->

</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
