<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <!-- Anti-FOUC : pose data-theme AVANT le premier paint (choix mémorisé sinon préférence système). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wahm_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <!-- Titre et meta par page : injectes par le composant Seo (vite-react-ssg Head). -->
  <link rel="icon" type="image/png" href="/assets/wahm-mark.png" />
  <!-- Montserrat et Inter sont auto-hébergés (voir src/index.css) : plus aucune requête
       vers fonts.googleapis.com / fonts.gstatic.com.
       General Sans reste servi par Fontshare (licence de redistribution non vérifiable),
       mais sans bloquer le premier rendu : la feuille est chargée en media="print" puis
       réactivée. Le texte s'affiche entretemps en Montserrat, exactement comme le fait
       déjà le font-display:swap actuel — et comme le fait le russe, que General Sans ne
       couvre pas. Graisse 500 retirée : déclarée mais jamais utilisée. -->
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@600,700&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@600,700&display=swap" />
  </noscript>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
